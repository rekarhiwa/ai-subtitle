name: ai_subtitle
description: Local AI video subtitles for Kurdish Sorani — FFmpeg + Gemini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  logging: ^1.3.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_android_video: ^1.3.8
  desktop_drop: ^0.8.4
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/prompts/transcription_prompt.txt
    - assets/fonts/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
